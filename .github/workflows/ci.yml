name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}-source
  cancel-in-progress: true

jobs:
  plan:
    name: PR / Plan
    runs-on: ubuntu-latest
    outputs:
      browser_full: ${{ steps.impact.outputs.browser_full }}
      browser_required: ${{ steps.impact.outputs.browser_required }}
      browser_focus_grep: ${{ steps.impact.outputs.browser_focus_grep }}
      browser_matrix: ${{ steps.impact.outputs.browser_matrix }}
      windows_full: ${{ steps.impact.outputs.windows_full }}
      windows_required: ${{ steps.impact.outputs.windows_required }}
      windows_matrix: ${{ steps.impact.outputs.windows_matrix }}
      python_matrix: ${{ steps.impact.outputs.python_matrix }}
      python_max_parallel: ${{ steps.impact.outputs.python_max_parallel }}
      python_required: ${{ steps.impact.outputs.python_required }}
      generated_test_modules: ${{ steps.impact.outputs.generated_test_modules }}
      package_full: ${{ steps.impact.outputs.package_full }}
      package_required: ${{ steps.impact.outputs.package_required }}
      required_jobs: ${{ steps.impact.outputs.required_jobs }}
      risk_class: ${{ steps.impact.outputs.risk_class }}
      windows_max_parallel: ${{ steps.impact.outputs.windows_max_parallel }}
      ci_peak_jobs: ${{ steps.impact.outputs.ci_peak_jobs }}
      ci_job_headroom: ${{ steps.impact.outputs.ci_job_headroom }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Validate pull request description and status provenance
        if: github.event_name == 'pull_request'
        run: python scripts/validate_pr_body.py
      - id: risk_sentinel
        name: Independently protect test-selection authority
        run: python scripts/ci_risk_sentinel.py --github-output "${GITHUB_OUTPUT}"
      - id: impact
        name: Classify exact changed-file impact
        run: >-
          python scripts/ci_plan.py
          --force-high-risk "${{ steps.risk_sentinel.outputs.force_high_risk }}"
      - name: Publish generated exact-head evidence
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/pr_evidence.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --format markdown >> "${GITHUB_STEP_SUMMARY}"
      - name: Validate compact card and deck dependency closure
        run: python scripts/build_test_database.py validate-ci-dependencies
      - name: Require green completed main regression
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p local
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&status=completed&per_page=100" > local/main-runs.json
          python scripts/main_health.py --runs-json local/main-runs.json --event "${GITHUB_EVENT_PATH}"

  python:
    name: PR / Python / ${{ matrix.suite }}
    needs: plan
    if: >-
      needs.plan.outputs.python_required == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.python_max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.python_matrix) }}
    env:
      MTG_CARD_DB: data/test-ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Build compact offline card database
        run: >-
          python scripts/build_test_database.py build-ci
          --output data/test-ci.sqlite3
      - name: Run functional shard
        run: >-
          python scripts/test_shards.py run-modules ${{ matrix.modules }}
          --suite-name "${{ matrix.suite }}"
          --backend pytest-xdist
          --workers 4
          --platform ubuntu
          --result-json "local/python-results/${{ matrix.shard }}.json"
      - name: Upload Linux shard result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-results-${{ matrix.shard }}-${{ github.run_id }}
          path: local/python-results/${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 14

  generated:
    name: PR / Generated and architecture
    needs: plan
    runs-on: ubuntu-latest
    env:
      MTG_CARD_DB: data/test-ci.sqlite3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Install package and validation dependencies
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Build compact offline card database
        run: >-
          python scripts/build_test_database.py build-ci
          --output data/test-ci.sqlite3
      - name: Validate canonical compact fixture ownership
        run: python scripts/build_test_database.py validate-ci
      - name: Validate Python runtime and compile
        run: |
          python scripts/validate_python_runtime.py
          python -m compileall -q quorune server tests scripts simctl.py
      - name: Verify generated outputs
        run: python scripts/finalize_generated.py --check
      - name: Run generated conformance and governance tests
        if: needs.plan.outputs.risk_class == 'high_risk_source'
        run: python scripts/test_shards.py run generated-validation
      - name: Run impact-selected governance and invariant tests
        if: >-
          needs.plan.outputs.risk_class != 'high_risk_source' &&
          needs.plan.outputs.generated_test_modules != ''
        run: >-
          python scripts/test_shards.py run-modules
          ${{ needs.plan.outputs.generated_test_modules }}
      - name: Verify architecture, documentation, and repository policy
        run: python scripts/validate_repository.py

  package:
    name: PR / Package
    needs: plan
    if: >-
      needs.plan.outputs.package_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Verify installed package and entry points
        run: python -c "import quorune; import server"
      - name: Build wheel
        if: needs.plan.outputs.package_full == 'true'
        run: python -m build --wheel
      - name: Verify clean wheel installation and CLI
        if: needs.plan.outputs.package_full == 'true'
        run: python scripts/verify_wheel.py

  windows_compatibility:
    name: PR / Windows / compatibility
    needs: plan
    if: >-
      needs.plan.outputs.windows_required == 'true' &&
      needs.plan.outputs.windows_full != 'true'
    runs-on: windows-latest
    env:
      MTG_CARD_DB: data/test-ci-windows-compat.sqlite3
      MTG_SERVER_DATA: local/windows-runtime-compatibility
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Validate runtime and build compact card database
        shell: pwsh
        run: |
          python scripts/validate_python_runtime.py
          python scripts/build_test_database.py validate-ci-dependencies
          python scripts/build_test_database.py build-ci `
            --output data/test-ci-windows-compat.sqlite3
      - name: Run focused Windows compatibility suite
        run: >-
          python scripts/test_shards.py run windows-compat
          --backend pytest-xdist
          --workers 4
          --platform windows
          --result-json local/windows-results/windows-compat.json
      - name: Upload Windows compatibility result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-results-compatibility-${{ github.run_id }}
          path: local/windows-results/windows-compat.json
          if-no-files-found: warn
          retention-days: 14

  windows_full:
    name: PR / Windows / ${{ matrix.shard }}
    needs: plan
    if: >-
      needs.plan.outputs.windows_required == 'true' &&
      needs.plan.outputs.windows_full == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.windows_max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.windows_matrix) }}
    env:
      MTG_CARD_DB: data/test-ci-windows-${{ matrix.shard }}.sqlite3
      MTG_SERVER_DATA: local/windows-runtime-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history remains available to provenance tests in every shard.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Validate manifest, runtime, and build isolated card database
        shell: pwsh
        run: |
          python scripts/test_shards.py validate
          python scripts/validate_python_runtime.py
          python scripts/build_test_database.py validate-ci-dependencies
          python scripts/build_test_database.py build-ci `
            --output "data/test-ci-windows-${{ matrix.shard }}.sqlite3"
      - name: Run functional Windows shard
        if: matrix.shard != 'generated-validation'
        run: >-
          python scripts/test_shards.py run "${{ matrix.shard }}"
          --backend pytest-xdist
          --workers 4
          --platform windows
          --result-json "local/windows-results/${{ matrix.shard }}.json"
      - name: Run sequential generated and governance shard
        if: matrix.shard == 'generated-validation'
        run: >-
          python scripts/test_shards.py run "${{ matrix.shard }}"
          --platform windows
          --result-json "local/windows-results/${{ matrix.shard }}.json"
      - name: Upload Windows shard result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-results-${{ matrix.shard }}-${{ github.run_id }}
          path: local/windows-results/${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 14

  windows_package:
    name: PR / Windows / package
    needs: plan
    if: >-
      needs.plan.outputs.package_full == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Install build tooling
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Build and verify Windows wheel
        shell: pwsh
        run: |
          python -m build --wheel
          python scripts/verify_wheel.py

  windows_certification:
    name: PR / Windows Certification
    if: >-
      always() &&
      needs.plan.outputs.windows_required == 'true'
    needs: [plan, windows_compatibility, windows_full, windows_package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Install certification dependencies
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Download Windows shard results
        uses: actions/download-artifact@v4
        with:
          pattern: windows-results-*-${{ github.run_id }}
          path: local/windows-results
          merge-multiple: false
      - name: Certify Windows mode, partition, results, and package
        env:
          CI_WINDOWS_NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          python scripts/verify_windows_ci.py
          --results-dir local/windows-results
          --full "${{ needs.plan.outputs.windows_full }}"

  browser:
    name: PR / Browser / ${{ matrix.group }}
    needs: plan
    if: >-
      needs.plan.outputs.browser_required == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.browser_matrix) }}
    env:
      MTG_BROWSER_GROUP: ${{ matrix.group }}
      MTG_CARD_DB: data/test-ci-${{ matrix.group }}.sqlite3
      MTG_E2E_SERVER_PORT: ${{ matrix.server_port }}
      MTG_E2E_WEB_PORT: ${{ matrix.web_port }}
      MTG_E2E_RUNTIME_DIR: ../local/playwright-${{ matrix.group }}
      MTG_PLAYWRIGHT_JSON: ../local/playwright-${{ matrix.group }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/package-lock.json') }}
      - name: Install server and browser dependencies
        run: |
          python -m pip install -e . -r requirements-dev.txt
          npm ci --prefix web
      - name: Build compact offline card database
        run: >-
          python scripts/build_test_database.py build-ci
          --output data/test-ci-${{ matrix.group }}.sqlite3
      - name: Verify generated protocol types and production build
        run: |
          npm run generate:types --prefix web
          git diff --exit-code -- web/src/generated
          npm run build --prefix web
      - name: Install headless Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run compact four-context smoke
        if: needs.plan.outputs.browser_full != 'true'
        run: npm run e2e:smoke --prefix web
      - name: Run focused browser journeys for affected rules
        if: >-
          needs.plan.outputs.browser_full != 'true' &&
          needs.plan.outputs.browser_focus_grep != ''
        working-directory: web
        env:
          MTG_BROWSER_FOCUS_GREP: ${{ needs.plan.outputs.browser_focus_grep }}
          MTG_PLAYWRIGHT_JSON: ../local/playwright-focused.json
        run: npx playwright test --grep "$MTG_BROWSER_FOCUS_GREP"
      - name: Run complete browser journeys for affected changes
        if: needs.plan.outputs.browser_full == 'true'
        working-directory: web
        env:
          MTG_BROWSER_GROUP_GREP: ${{ matrix.grep }}
        run: npx playwright test --grep "$MTG_BROWSER_GROUP_GREP"
      - name: Upload browser journey report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results-${{ matrix.group }}-${{ github.run_id }}
          path: |
            local/playwright-*.json
            web/test-results
          if-no-files-found: warn
          retention-days: 14

  certification:
    name: PR / Certification
    if: always()
    needs: [plan, python, generated, package, windows_certification, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Require every PR gate
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_REQUIRED_JOBS_JSON: ${{ needs.plan.outputs.required_jobs }}
        run: python scripts/verify_ci_needs.py
      - name: Create exact-head certification receipt
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          MTG_EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MTG_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          python scripts/certification_receipt.py create
          --repository "${GITHUB_REPOSITORY}"
          --pull-request "${MTG_PR_NUMBER}"
          --exact-head-sha "${MTG_EXACT_HEAD_SHA}"
          --workflow-run-id "${GITHUB_RUN_ID}"
          --needs-json "${CI_NEEDS_JSON}"
          --required-jobs-json '${{ needs.plan.outputs.required_jobs }}'
          --output local/certification-receipt.json
      - name: Publish exact-head certification receipt
        uses: actions/upload-artifact@v4
        with:
          name: exact-head-certification-${{ github.run_id }}
          path: local/certification-receipt.json
          if-no-files-found: error
          retention-days: 30
