name: Main smoke

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: main-smoke-${{ github.sha }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Main / Integration smoke
    runs-on: ubuntu-latest
    env:
      MTG_CARD_DB: data/test-ci.sqlite3
    steps:
      - uses: actions/checkout@v4
        with:
          # Main certification resolves the merged PR and exact-head receipt.
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Verify exact-head certification receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/certification_receipt.py verify-main
          --repository "${GITHUB_REPOSITORY}"
          --merge-sha "${GITHUB_SHA}"
      - name: Install dependencies
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Build compact database
        run: |
          python scripts/build_test_database.py validate-ci-dependencies
          python scripts/build_test_database.py build-ci --output data/test-ci.sqlite3
      - name: Load committed state and run deterministic replay/server integration
        run: python scripts/test_shards.py run main-integration-smoke
