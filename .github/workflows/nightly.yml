name: Nightly assurance

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-assurance
  cancel-in-progress: false

jobs:
  plan:
    name: Nightly / Plan
    runs-on: ubuntu-latest
    outputs:
      python_matrix: ${{ steps.plan.outputs.python_matrix }}
      python_max_parallel: ${{ steps.plan.outputs.python_max_parallel }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Planning and later certification both validate complete provenance.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - id: plan
        name: Build duration-aware cross-platform shard plan
        run: python scripts/nightly_ci.py

  python:
    name: Nightly / Python / ${{ matrix.platform }} / ${{ matrix.shard }}
    needs: plan
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.python_max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.python_matrix) }}
    env:
      MTG_CARD_DB: data/test-ci-${{ matrix.platform }}-${{ matrix.shard }}.sqlite3
      MTG_SERVER_DATA: local/nightly-runtime-${{ matrix.platform }}-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The complete suite validates certified commit provenance.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Install and prepare
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Build compact database
        run: |
          python scripts/build_test_database.py validate-ci-dependencies
          python scripts/build_test_database.py build-ci --output "data/test-ci-${{ matrix.platform }}-${{ matrix.shard }}.sqlite3"
      - id: validator_runtime
        name: Detect TypeScript validator integration
        run: >-
          python -c "import json, os, sys; from pathlib import Path; modules = json.loads(Path('platform/test-shards.json').read_text(encoding='utf-8'))['primary_shards'][sys.argv[1]]; Path(os.environ['GITHUB_OUTPUT']).write_text('node_required=' + str('test_public_quantity_mana' in modules).lower() + chr(10), encoding='utf-8')"
          "${{ matrix.shard }}"
      - uses: actions/setup-node@v4
        if: steps.validator_runtime.outputs.node_required == 'true'
        with:
          node-version: "24"
      - name: Run functional shard with fixed collection-preserving workers
        if: matrix.shard != 'generated-validation'
        run: >-
          python scripts/test_shards.py run "${{ matrix.shard }}"
          --backend pytest-xdist
          --workers 4
          --platform "${{ matrix.platform }}"
          --result-json "local/nightly-python/${{ matrix.platform }}-${{ matrix.shard }}.json"
      - name: Run sequential generated and governance shard
        if: matrix.shard == 'generated-validation'
        run: >-
          python scripts/test_shards.py run "${{ matrix.shard }}"
          --platform "${{ matrix.platform }}"
          --result-json "local/nightly-python/${{ matrix.platform }}-${{ matrix.shard }}.json"
      - name: Upload nightly Python shard result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-python-${{ matrix.platform }}-${{ matrix.shard }}-${{ github.run_id }}
          path: local/nightly-python/${{ matrix.platform }}-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 14

  browser:
    name: Nightly / Browser / ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: lifecycle
            grep: "@browser-lifecycle"
            server_port: 18081
            web_port: 15171
          - group: rules
            grep: "@browser-rules"
            server_port: 18082
            web_port: 15172
          - group: soak
            grep: "@browser-soak"
            server_port: 18083
            web_port: 15173
    env:
      MTG_BROWSER_GROUP: ${{ matrix.group }}
      MTG_BROWSER_GROUP_GREP: ${{ matrix.grep }}
      MTG_CARD_DB: data/test-ci-${{ matrix.group }}.sqlite3
      MTG_E2E_SERVER_PORT: ${{ matrix.server_port }}
      MTG_E2E_WEB_PORT: ${{ matrix.web_port }}
      MTG_E2E_RUNTIME_DIR: ../local/playwright-${{ matrix.group }}
      MTG_PLAYWRIGHT_JSON: ../local/playwright-${{ matrix.group }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/package-lock.json') }}
      - name: Install and prepare
        run: |
          python -m pip install -e . -r requirements-dev.txt
          npm ci --prefix web
          python scripts/build_test_database.py validate-ci-dependencies
          python scripts/build_test_database.py build-ci \
            --output data/test-ci-${{ matrix.group }}.sqlite3
      - name: Install headless Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run measured isolated headless group
        working-directory: web
        run: npx playwright test --grep "$MTG_BROWSER_GROUP_GREP"
      - name: Upload browser journey report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-browser-${{ matrix.group }}-${{ github.run_id }}
          path: |
            local/playwright-${{ matrix.group }}.json
            web/test-results
          if-no-files-found: warn
          retention-days: 14

  properties:
    name: Nightly / Property / ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - test_counter_placement_replacements
          - test_damage_replacement_model
          - test_damage_result_events
    env:
      MTG_CARD_DB: data/test-ci.sqlite3
      MTG_PROPERTY_TRANSITIONS: "33334"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Install and prepare
        run: |
          python -m pip install -e . -r requirements-dev.txt
          python scripts/build_test_database.py validate-ci-dependencies
          python scripts/build_test_database.py build-ci \
            --output data/test-ci.sqlite3
      - name: Run deterministic property budget
        run: python scripts/test_shards.py run-modules "${{ matrix.module }}"

  mutation-and-soak:
    name: Nightly / Mutation and soak
    runs-on: ubuntu-latest
    env:
      MTG_CARD_DB: data/test-ci.sqlite3
    steps:
      - uses: actions/checkout@v4
        with:
          # Repository validation resolves every recorded certified/feature SHA.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Install and prepare
        run: |
          python -m pip install -e . -r requirements-dev.txt
          python scripts/build_test_database.py validate-ci-dependencies
          python scripts/build_test_database.py build-ci \
            --output data/test-ci.sqlite3
      - name: Run focused mutations, full game, persistence, and performance
        run: |
          python scripts/finalize_generated.py --check
          python scripts/test_shards.py run-modules \
            test_capability_implementation_mutations \
            test_deterministic_full_game \
            test_server_persistence
          python scripts/validate_repository.py

  corpus:
    name: Nightly / Current Oracle census
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Install package
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Build current Scryfall database and run complete censuses
        run: |
          mkdir -p local/nightly
          python scripts/bootstrap_data.py \
            --refresh-from-scryfall \
            --output data/scryfall-nightly.sqlite3 \
            --download-dir local/nightly/bulk \
            --force
          python simctl.py oracle coverage --db data/scryfall-nightly.sqlite3 \
            --profile commander_review --output local/nightly/oracle-full.json
          python simctl.py oracle coverage --db data/scryfall-nightly.sqlite3 \
            --profile commander_review --commander-legal-only \
            --output local/nightly/oracle-commander.json
          python simctl.py card coverage --db data/scryfall-nightly.sqlite3 \
            --profile commander_review --output local/nightly/card-full.json
          python simctl.py card coverage --db data/scryfall-nightly.sqlite3 \
            --profile commander_review --commander-legal-only \
            --output local/nightly/card-commander.json
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-corpus-${{ github.run_id }}
          path: local/nightly/*.json
          retention-days: 14

  security:
    name: Nightly / Dependency and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Audit Python and browser dependencies
        run: |
          python -m pip install -e . -r requirements-dev.txt pip-audit
          python -m pip_audit
          npm ci --prefix web
          npm audit --prefix web --audit-level=high

  certification:
    name: Nightly / Certification
    if: always()
    needs: [plan, python, browser, properties, mutation-and-soak, corpus, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Install certification dependencies
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Download every cross-platform shard result
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-python-*-${{ github.run_id }}
          path: local/nightly-python-results
          merge-multiple: false
      - name: Certify dependency graph, exact collections, and result coverage
        env:
          CI_NIGHTLY_NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          python scripts/verify_nightly_ci.py
          --results-dir local/nightly-python-results
